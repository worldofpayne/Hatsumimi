# Hatsumimi pause-panel options (mpv script-opts/hatsumimi.conf)
# Remove the leading "#" from a line to change that setting.

# How many past lines the panel shows
#lines=5

# Share of the window the panel takes (0.42 = 42%)
#panel_width=0.42

# Font for the panel: must contain Japanese (Yu Gothic UI, Meiryo, MS Gothic...)
#font=Yu Gothic UI

# Text sizes (units of a 720-pixel-high screen)
#ja_size=34
#en_size=22

# Show the English when the panel opens (E toggles it either way)
#show_english=yes

# Seconds of lead-in / lead-out when replaying a line
#replay_padding=0.25

# Where lines marked with M are saved (~~ = this mpv config folder)
#log_path=~~/hatsumimi-missed.jsonl
